<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/voz.js"></script>
    <script src="assets/mola.js"></script>
    <script src="assets/roleta.js"></script>
    <script src="assets/roletas.js"></script>
    <!-- componentes da novela (fonte: modelos/componentes/ da skill, copiados pelo montar_projeto.py) -->
    <link rel="stylesheet" href="assets/novela/novela.css" />
    <script src="assets/novela/novela.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 400; src: url("assets/fontes/montserrat-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url("assets/fontes/montserrat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fontes/montserrat-latin-900-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Montserrat", sans-serif; color: #f3f1ec; }
      #marca-dagua { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- GERADO por montar_projeto.py (não edite à mão: o script reescreve este arquivo). {{TITULO}}, {{DURACAO}} s.
         Janelas: do início do primeiro bloco do ato ao início do ato seguinte + 0,30 s de sobreposição (no tempo real da
         narração, VOZ.w do início do ato). O ato que ENTRA está por cima (ordem no DOM e track maior) e faz o chicote ou o
         corte; o que sai segura o último quadro. Cada agente de ato mexe só no próprio compositions/atoN.html e em
         assets/atoN/. Ordem no DOM = empilhamento: atos, barra de jogo, legenda, marca d'água vazia. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="{{DURACAO}}" data-width="1080" data-height="1920">
      <audio id="voz" src="narracao.wav" data-start="0" data-duration="{{DURACAO}}" data-track-index="0" data-volume="1"></audio>

{{ATOS}}

      <!-- barra de jogo: camada própria por cima dos atos, o vídeo inteiro (eventos em assets/barra-eventos.js) -->
      <div id="cena-barra" class="clip" data-composition-id="barra" data-composition-src="compositions/barra.html"
           data-start="0" data-duration="{{DURACAO}}" data-track-index="{{TRACK_BARRA}}" data-width="1080" data-height="1920"></div>
      <div id="cena-legenda" class="clip" data-composition-id="legenda" data-composition-src="compositions/legenda.html"
           data-start="0" data-duration="{{DURACAO}}" data-track-index="{{TRACK_LEGENDA}}" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <!-- Novela: sem marca d'água (régua da novela). A camada fica, vazia. -->
      <div id="marca-dagua" class="clip" data-layout-ignore data-start="0" data-duration="{{DURACAO}}" data-track-index="{{TRACK_MARCA}}"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
